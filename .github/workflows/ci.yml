name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Run tests
        run: uv run pytest

      - name: Run decision eval
        run: uv run python evals/run_eval.py

      - name: Smoke-test the API
        run: uv run python scripts/api_smoke.py
