[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underwriting-agent"
version = "0.1.0"
description = "A deterministic multi-role loan-underwriting pipeline where every number is computed in Python and the narration is advisory only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emory Long" }]
keywords = ["underwriting", "loan", "agent", "deterministic", "advisory", "llm", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
underwriting = "underwriting_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
